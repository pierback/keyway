<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Output Route</title>
  <desc id="desc">A quiet output-routing symbol with a source node handed to an audio endpoint.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="76%">
      <stop stop-color="#292D30"/>
      <stop offset="0.66" stop-color="#121518"/>
      <stop offset="1" stop-color="#050607"/>
    </radialGradient>
    <linearGradient id="route" x1="250" y1="270" x2="774" y2="754" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEEAE2"/>
      <stop offset="0.5" stop-color="#AEB8BA"/>
      <stop offset="1" stop-color="#7CA7FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.52"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <g filter="url(#shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="282" y="300" width="460" height="424" rx="116" stroke="#EEEAE2" stroke-width="42" opacity="0.16"/>
    <path d="M322 512H646" stroke="url(#route)" stroke-width="48"/>
    <path d="M574 434L658 512L574 590" stroke="#7CA7FF" stroke-width="42"/>
    <circle cx="322" cy="512" r="48" fill="#121518" stroke="#EEEAE2" stroke-width="34"/>
    <rect x="648" y="404" width="96" height="216" rx="40" fill="#121518" stroke="#EEEAE2" stroke-width="34"/>
    <circle cx="696" cy="470" r="14" fill="#EEEAE2"/>
    <circle cx="696" cy="560" r="24" fill="none" stroke="#EEEAE2" stroke-width="14"/>
  </g>
</svg>
