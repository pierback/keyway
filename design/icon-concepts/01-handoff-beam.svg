<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Handoff Beam</title>
  <desc id="desc">A compact speaker with a handoff beam and soft green signal arcs.</desc>
  <defs>
    <linearGradient id="bg" x1="160" y1="120" x2="864" y2="904" gradientUnits="userSpaceOnUse">
      <stop stop-color="#26303B"/>
      <stop offset="0.58" stop-color="#151A20"/>
      <stop offset="1" stop-color="#0A0D10"/>
    </linearGradient>
    <linearGradient id="beam" x1="302" y1="374" x2="750" y2="580" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34F177"/>
      <stop offset="1" stop-color="#10B8FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <path d="M242 638C352 730 501 782 696 770" fill="none" stroke="#34F177" stroke-width="34" stroke-linecap="round" opacity="0.18"/>
  <path d="M270 564C382 635 511 670 676 652" fill="none" stroke="#34F177" stroke-width="30" stroke-linecap="round" opacity="0.34"/>
  <g filter="url(#shadow)">
    <rect x="262" y="284" width="258" height="456" rx="72" fill="#222A31" stroke="#DCE4EA" stroke-opacity="0.22" stroke-width="10"/>
    <circle cx="391" cy="414" r="50" fill="none" stroke="#E9F2F5" stroke-width="20"/>
    <circle cx="391" cy="594" r="72" fill="#0E1317" stroke="#E9F2F5" stroke-opacity="0.82" stroke-width="18"/>
    <circle cx="391" cy="594" r="26" fill="#E9F2F5"/>
  </g>
  <path d="M512 506C581 438 665 402 765 398" fill="none" stroke="url(#beam)" stroke-width="42" stroke-linecap="round"/>
  <path d="M720 326L803 398L728 480" fill="none" stroke="#34F177" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
