<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Gateway Speaker</title>
  <desc id="desc">A restrained speaker gateway mark showing audio handed through a central output.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="76%">
      <stop stop-color="#272D2E"/>
      <stop offset="0.64" stop-color="#121516"/>
      <stop offset="1" stop-color="#050606"/>
    </radialGradient>
    <linearGradient id="mark" x1="292" y1="252" x2="732" y2="772" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0EEE8"/>
      <stop offset="0.62" stop-color="#AEB6B2"/>
      <stop offset="1" stop-color="#6BD08E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.52"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="386" y="242" width="252" height="540" rx="92" fill="#F0EEE8" opacity="0.1"/>
    <rect x="420" y="284" width="184" height="456" rx="72" fill="none" stroke="url(#mark)" stroke-width="44"/>
    <circle cx="512" cy="418" r="42" fill="none" stroke="#F0EEE8" stroke-width="26" opacity="0.88"/>
    <circle cx="512" cy="594" r="64" fill="none" stroke="#F0EEE8" stroke-width="26" opacity="0.88"/>
    <circle cx="512" cy="594" r="18" fill="#F0EEE8"/>
    <path d="M246 512H372" stroke="#F0EEE8" stroke-width="38" stroke-linecap="round" opacity="0.28"/>
    <path d="M652 512H778" stroke="#6BD08E" stroke-width="38" stroke-linecap="round"/>
    <path d="M716 454L778 512L716 570" fill="none" stroke="#6BD08E" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
