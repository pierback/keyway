<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Group Bridge</title>
  <desc id="desc">Two compact speaker marks bridged into one grouped output.</desc>
  <defs>
    <linearGradient id="bg" x1="136" y1="104" x2="888" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#282C2E"/>
      <stop offset="0.62" stop-color="#121516"/>
      <stop offset="1" stop-color="#050606"/>
    </linearGradient>
    <linearGradient id="bridge" x1="256" y1="316" x2="768" y2="708" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEE9DF"/>
      <stop offset="0.54" stop-color="#B2B9B4"/>
      <stop offset="1" stop-color="#63CF8B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.52"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="250" y="352" width="182" height="320" rx="62" fill="none" stroke="#EEE9DF" stroke-width="40" opacity="0.88"/>
    <rect x="592" y="352" width="182" height="320" rx="62" fill="none" stroke="#EEE9DF" stroke-width="40" opacity="0.88"/>
    <circle cx="341" cy="454" r="30" fill="none" stroke="#EEE9DF" stroke-width="20"/>
    <circle cx="683" cy="454" r="30" fill="none" stroke="#EEE9DF" stroke-width="20"/>
    <circle cx="341" cy="572" r="44" fill="none" stroke="#EEE9DF" stroke-width="22"/>
    <circle cx="683" cy="572" r="44" fill="none" stroke="#EEE9DF" stroke-width="22"/>
    <path d="M432 512H592" stroke="url(#bridge)" stroke-width="44" stroke-linecap="round"/>
    <circle cx="512" cy="512" r="30" fill="#63CF8B"/>
    <path d="M312 744C430 804 594 804 712 744" fill="none" stroke="url(#bridge)" stroke-width="30" stroke-linecap="round" opacity="0.54"/>
  </g>
</svg>
