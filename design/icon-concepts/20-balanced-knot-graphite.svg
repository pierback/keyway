<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Balanced Knot Graphite</title>
  <desc id="desc">A near-monochrome symmetric abstract knot.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="76%">
      <stop stop-color="#2A2D2D"/>
      <stop offset="0.66" stop-color="#121414"/>
      <stop offset="1" stop-color="#050606"/>
    </radialGradient>
    <linearGradient id="main" x1="256" y1="256" x2="768" y2="768" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0EEE8"/>
      <stop offset="0.48" stop-color="#A9AEAC"/>
      <stop offset="1" stop-color="#5D6664"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.54"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <g filter="url(#shadow)" fill="none" stroke-linecap="round">
    <ellipse cx="512" cy="512" rx="252" ry="148" stroke="url(#main)" stroke-width="52"/>
    <ellipse cx="512" cy="512" rx="148" ry="252" stroke="url(#main)" stroke-width="52" opacity="0.72"/>
    <path d="M330 330L694 694" stroke="#F0EEE8" stroke-opacity="0.14" stroke-width="30"/>
    <path d="M694 330L330 694" stroke="#F0EEE8" stroke-opacity="0.14" stroke-width="30"/>
  </g>
  <circle cx="512" cy="512" r="30" fill="#F0EEE8"/>
</svg>
