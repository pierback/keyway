    <path d="M318 610V414" stroke="url(#mark)" stroke-width="44"/>
    <path d="M448 552V472" stroke="url(#mark)" stroke-width="44"/>
    <path d="M576 472V552" stroke="url(#mark)" stroke-width="44"/>
