<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Signal Lattice</title>
  <desc id="desc">A balanced lattice of signal levels, suggesting grouped audio control.</desc>
  <defs>
