      <stop offset="1" stop-color="#070504"/>
    </linearGradient>
    <linearGradient id="mark" x1="280" y1="278" x2="744" y2="746" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3E7D3"/>
