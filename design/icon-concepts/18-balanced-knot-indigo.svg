<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Balanced Knot Indigo</title>
  <desc id="desc">A symmetric abstract knot in muted indigo and porcelain.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="76%">
      <stop stop-color="#262837"/>
      <stop offset="0.66" stop-color="#11121A"/>
      <stop offset="1" stop-color="#06060A"/>
    </radialGradient>
    <linearGradient id="main" x1="256" y1="256" x2="768" y2="768" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEEAF0"/>
      <stop offset="0.48" stop-color="#9EA2D8"/>
      <stop offset="1" stop-color="#58627F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.52"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <g filter="url(#shadow)" fill="none" stroke-linecap="round">
    <ellipse cx="512" cy="512" rx="250" ry="154" stroke="url(#main)" stroke-width="52"/>
    <ellipse cx="512" cy="512" rx="154" ry="250" stroke="url(#main)" stroke-width="52" opacity="0.82"/>
    <circle cx="512" cy="512" r="106" stroke="#EEEAF0" stroke-opacity="0.22" stroke-width="34"/>
  </g>
  <circle cx="512" cy="512" r="30" fill="#EEEAF0"/>
</svg>
