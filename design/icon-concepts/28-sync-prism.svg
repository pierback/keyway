<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Sync Prism</title>
  <desc id="desc">A centered prism-like mark for sync and routing without literal devices.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="76%">
      <stop stop-color="#2B2D31"/>
      <stop offset="0.64" stop-color="#131519"/>
      <stop offset="1" stop-color="#06070A"/>
    </radialGradient>
    <linearGradient id="mark" x1="304" y1="246" x2="720" y2="778" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0ECE7"/>
      <stop offset="0.48" stop-color="#AAAFC3"/>
      <stop offset="1" stop-color="#8C8AEF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.52"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <g filter="url(#shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 258L722 512L512 766L302 512Z" stroke="url(#mark)" stroke-width="52"/>
    <path d="M512 258V766" stroke="#F0ECE7" stroke-opacity="0.22" stroke-width="30"/>
    <path d="M302 512H722" stroke="#F0ECE7" stroke-opacity="0.22" stroke-width="30"/>
    <path d="M396 374L628 650" stroke="#F0ECE7" stroke-opacity="0.14" stroke-width="26"/>
    <path d="M628 374L396 650" stroke="#F0ECE7" stroke-opacity="0.14" stroke-width="26"/>
  </g>
  <circle cx="512" cy="512" r="30" fill="#F0ECE7"/>
</svg>
