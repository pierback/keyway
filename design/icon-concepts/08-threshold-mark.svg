<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Threshold Mark</title>
  <desc id="desc">A precise abstract threshold shape suggesting playback crossing from one room to another.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="75%">
      <stop stop-color="#272B2D"/>
      <stop offset="0.64" stop-color="#121516"/>
      <stop offset="1" stop-color="#060707"/>
    </radialGradient>
    <linearGradient id="edge" x1="302" y1="210" x2="730" y2="824" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2EDE3"/>
      <stop offset="0.65" stop-color="#C3C7C4"/>
      <stop offset="1" stop-color="#52DF87"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <path d="M324 266H700C736 266 760 305 742 337L560 656C541 690 493 690 474 656L292 337C274 305 288 266 324 266Z"
      fill="none" stroke="url(#edge)" stroke-width="54" stroke-linejoin="round"/>
    <path d="M396 392H628L512 594L396 392Z" fill="#F2EDE3" opacity="0.08"/>
    <path d="M512 340V688" stroke="#F2EDE3" stroke-width="32" stroke-linecap="round" opacity="0.45"/>
    <circle cx="512" cy="702" r="34" fill="#52DF87"/>
  </g>
</svg>
